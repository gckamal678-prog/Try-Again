<!DOCTYPE html>
<html lang="ne" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - नेपाली क्यालेन्डर</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<!-- Nepali Date Converter Library via CDN -->
<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.4.0/dist/nepali-date-converter.umd.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<!-- SIDEBAR -->
<div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                Digital NoteBook
            </h1>
        </div>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
    </div>

    <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
            <div>
                <h3 id="sidebar-profile-name" class="text-white font-bold text-sm">Kamal G.C.</h3>
                <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Digital NoteBook User" data-np="डिजिटल नोटबुक प्रयोगकर्ता">Digital NoteBook User</span></p>
            </div>
        </div>

        <nav class="space-y-1 font-medium">
            <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>🏠</span> <span class="lang-text" data-en="Home / Dashboard" data-np="गृहपृष्ठ / ड्यासबोर्ड">Home / Dashboard</span></a>
            <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>📅</span> <span class="lang-text" data-en="Nepali Calendar" data-np="नेपाली क्यालेन्डर">Nepali Calendar</span></a>
        </nav>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="flex-1 flex flex-col h-full w-full">
    
    <!-- HEADER SECTION -->
    <  <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                        Digital NoteBook
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
                <div class="relative cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

    <!-- CALENDAR FULL SCREEN CONTENT -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full bg-slate-100 dark:bg-slate-950 overflow-y-auto space-y-4">
        
        <!-- Calendar Card -->
        <div class="w-full max-w-md bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4">
            
            <!-- Header with Nepali Month & Navigation -->
            <div class="flex justify-between items-center px-1">
                <h2 id="calendar-month-year" class="text-sm font-bold text-slate-900 dark:text-white tracking-wide"></h2>
                <div class="flex items-center gap-1.5">
                    <button onclick="changeNepaliMonth(-1)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-emerald-600 hover:text-white text-xs transition border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="changeNepaliMonth(1)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-emerald-600 hover:text-white text-xs transition border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Week Days Header (Nepali) -->
            <div class="grid grid-cols-7 text-center text-xs font-semibold py-1">
                <span class="text-rose-500 font-bold">आइत</span>
                <span class="text-slate-500 dark:text-slate-400">सोम</span>
                <span class="text-slate-500 dark:text-slate-400">मङ्गल</span>
                <span class="text-slate-500 dark:text-slate-400">बुध</span>
                <span class="text-slate-500 dark:text-slate-400">बिही</span>
                <span class="text-slate-500 dark:text-slate-400">शुक्र</span>
                <span class="text-slate-500 dark:text-slate-400">शनि</span>
            </div>

            <!-- Days Grid -->
            <div id="calendar-days" class="grid grid-cols-7 gap-1.5 text-center text-xs">
                <!-- Dynamic Nepali Days will load here -->
            </div>
        </div>

        <!-- Selected Date Details Box -->
        <div class="w-full max-w-md bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-3 text-center">
            <p class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold">मिति विवरण</p>
            <p id="selected-date-info" class="text-xs font-bold text-slate-800 dark:text-slate-200 mt-0.5">लोड हुँदैछ...</p>
        </div>
    </main>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        renderNepaliCalendar();
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('theme-toggle-btn').innerText = '🌞';
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('theme-toggle-btn').innerText = '🌛';
        }
    }

    // NEPALI CALENDAR LOGIC 
    let currentBsDate = new NepaliDate();
    let viewYear = currentBsDate.getYear();
    let viewMonth = currentBsDate.getMonth(); // 0 देखि 11 सम्म

    const nepaliMonthsEN = [
        "Baishakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", 
        "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"
    ];
    const nepaliMonthsNP = [
        "वैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", 
        "कार्तिक", "मंसिर", "पौष", "माघ", "फागुन", "चैत"
    ];

    function convertToNepaliNumber(num) {
        if (currentLang === 'EN') return num;
        const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
        return num.toString().split('').map(digit => nepaliDigits[digit] !== undefined ? nepaliDigits[digit] : digit).join('');
    }

    function renderNepaliCalendar() {
        const monthYearEl = document.getElementById('calendar-month-year');
        const daysContainer = document.getElementById('calendar-days');
        
        let monthName = currentLang === 'NEP' ? nepaliMonthsNP[viewMonth] : nepaliMonthsEN[viewMonth];
        monthYearEl.innerText = `${monthName} ${convertToNepaliNumber(viewYear)}`;
        daysContainer.innerHTML = '';

        // महिनाको पहिलो मिति (NepaliDate(year, month, day) मा महिना ० देखि ११ नै हुन्छ)
        let firstDayBs = new NepaliDate(viewYear, viewMonth, 1);
        let firstDayWeekIndex = firstDayBs.getDay(); // 0 (आइतबार) देखि 6 (शनिबार)

        // खाली स्पेसहरू (पहिलो दिन अघि)
        for (let i = 0; i < firstDayWeekIndex; i++) {
            let dayDiv = document.createElement('div');
            dayDiv.className = "h-9";
            daysContainer.appendChild(dayDiv);
        }

        // महिनाभरिका दिनहरू लूप चलाउने (१ देखि ३२ सम्म जाँच्दै सही दिनमा रोक्ने)
        for (let day = 1; day <= 32; day++) {
            try {
                let tempDate = new NepaliDate(viewYear, viewMonth, day);
                // यदि महिना परिवर्तन भयो भने लूप ब्रेक गर्ने
                if (tempDate.getMonth() !== viewMonth) break;

                let dayDiv = document.createElement('div');
                dayDiv.innerText = convertToNepaliNumber(day);
                
                let isToday = (
                    day === currentBsDate.getDate() && 
                    viewMonth === currentBsDate.getMonth() && 
                    viewYear === currentBsDate.getYear()
                );

                let dayClass = "h-9 rounded-xl font-medium transition flex items-center justify-center cursor-pointer text-xs ";
                if (isToday) {
                    dayClass += "bg-emerald-600 text-white font-bold shadow-md shadow-emerald-500/20";
                } else {
                    dayClass += "bg-slate-50 dark:bg-slate-800/80 hover:bg-emerald-100 dark:hover:bg-emerald-950/50 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700/60";
                }

                dayDiv.className = dayClass;
                dayDiv.onclick = () => selectDate(viewYear, viewMonth, day);
                daysContainer.appendChild(dayDiv);
            } catch (e) {
                break;
            }
        }

        // हालको वा आजको मिति विवरण अपडेट गर्ने
        updateDateInfo(currentBsDate.getYear(), currentBsDate.getMonth(), currentBsDate.getDate());
    }

    function changeNepaliMonth(direction) {
        viewMonth += direction;
        if (viewMonth > 11) {
            viewMonth = 0;
            viewYear++;
        } else if (viewMonth < 0) {
            viewMonth = 11;
            viewYear--;
        }
        renderNepaliCalendar();
    }

    function selectDate(year, month, day) {
        updateDateInfo(year, month, day);
    }

    function updateDateInfo(year, month, day) {
        try {
            let selected = new NepaliDate(year, month, day);
            const daysListNP = ["आइतबार", "सोमबार", "मंगलवार", "बुधवार", "बिहीवार", "शुक्रवार", "शनिवार"];
            const daysListEN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            
            let dayName = currentLang === 'NEP' ? daysListNP[selected.getDay()] : daysListEN[selected.getDay()];
            let monthName = currentLang === 'NEP' ? nepaliMonthsNP[month] : nepaliMonthsEN[month];
            
            document.getElementById('selected-date-info').innerText = `${dayName}, ${monthName} ${convertToNepaliNumber(day)}, ${convertToNepaliNumber(year)}`;
        } catch (e) {
            document.getElementById('selected-date-info').innerText = "मितिको विवरण उपलब्ध छैन";
        }
    }

    function goToToday() {
        currentBsDate = new NepaliDate();
        viewYear = currentBsDate.getYear();
        viewMonth = currentBsDate.getMonth();
        renderNepaliCalendar();
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        renderNepaliCalendar();
        
        const savedName = localStorage.getItem('profile_name');
        if(savedName) {
            document.getElementById('sidebar-profile-name').innerText = savedName;
        }

        const htmlEl = document.documentElement;
        if(htmlEl.classList.contains('dark')) {
            document.getElementById('theme-toggle-btn').innerText = '🌛';
        } else {
            document.getElementById('theme-toggle-btn').innerText = '🌞';
        }
    });
</script>
</body>
</html>
