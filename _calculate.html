<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden">

<!-- TOAST NOTIFICATION -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

<!-- SIDEBAR -->
<div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-md">
                <i class="fa-solid fa-book-open text-white"></i>
            </div>
            <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-300 to-red-500">
                Digital <span class="text-red-500">NoteBook</span>
            </h1>
        </div>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
    </div>

    <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
            <div>
                <h3 id="sidebar-profile-name" class="text-white font-bold text-sm">Kamal G.C.</h3>
                <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Digital NoteBook User" data-np="डिजिटल नोटबुक प्रयोगकर्ता">Digital NoteBook User</span></p>
            </div>
        </div>

        <nav class="space-y-1 font-medium">
            <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>🏠</span> <span class="lang-text" data-en="Home / Dashboard" data-np="गृहपृष्ठ / ड्यासबोर्ड">Home / Dashboard</span></a>
            <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-md transition"><span>🧮</span> <span class="lang-text" data-en="Digital Calculator" data-np="डिजिटल क्याल्कुलेटर">Digital Calculator</span></a>
        </nav>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="flex-1 flex flex-col h-full w-full">
    <!-- HEADER -->
    <header class="sticky top-0 z-40 flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 shadow-md">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="text-white text-lg focus:outline-none"><i class="fa-solid fa-bars"></i></button>
            <span class="text-xs font-bold text-white tracking-wide">Digital NoteBook - Calculator</span>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Minimize Button -->
            <button onclick="minimizeCalculator()" title="Minimize" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-window-minimize text-[10px]"></i></button>
            <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200">ENG</button>
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm">🌛</button>
        </div>
    </header>

    <!-- CALCULATOR FULL SCREEN CONTENT -->
    <main id="main-calculator-container" class="flex-1 flex flex-col items-center justify-center p-4 w-full h-full bg-slate-100 dark:bg-slate-950 overflow-hidden">
        <div class="w-full max-w-md h-full max-h-[600px] flex flex-col bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
            
            <div class="flex justify-between items-center px-1">
                <p id="dynamic-date" class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase"></p>
                <span class="text-xs font-bold text-indigo-500"><i class="fa-solid fa-calculator"></i> Calculator</span>
            </div>

            <!-- Screen Display -->
            <div class="bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-right flex flex-col justify-end h-28 overflow-hidden shadow-inner flex-shrink-0">
                <div id="calc-history" class="text-slate-400 text-xs tracking-wide h-5 overflow-x-auto whitespace-nowrap"></div>
                <div id="calc-display" class="text-slate-900 dark:text-white text-4xl font-bold tracking-wider overflow-x-auto whitespace-nowrap">0</div>
            </div>

            <!-- Keypad Grid (Expands to fill available space) -->
            <div class="grid grid-cols-4 gap-2.5 flex-1">
                <button onclick="clearCalculator()" class="bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">C</button>
                <button onclick="appendValue('%')" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">%</button>
                <button onclick="deleteLast()" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center"><i class="fa-solid fa-delete-left"></i></button>
                <button onclick="appendValue('/')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">÷</button>

                <button onclick="appendValue('7')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">7</button>
                <button onclick="appendValue('8')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">8</button>
                <button onclick="appendValue('9')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">9</button>
                <button onclick="appendValue('*')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">×</button>

                <button onclick="appendValue('4')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">4</button>
                <button onclick="appendValue('5')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">5</button>
                <button onclick="appendValue('6')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">6</button>
                <button onclick="appendValue('-')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">-</button>

                <button onclick="appendValue('1')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">1</button>
                <button onclick="appendValue('2')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">2</button>
                <button onclick="appendValue('3')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">3</button>
                <button onclick="appendValue('+')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">+</button>

                <button onclick="appendValue('0')" class="col-span-2 bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">0</button>
                <button onclick="appendValue('.')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">.</button>
                <button onclick="calculateResult()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition shadow-md text-base flex items-center justify-center">=</button>
            </div>
        </div>
    </main>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('theme-toggle-btn').innerText = '🌞';
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('theme-toggle-btn').innerText = '🌛';
        }
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = dateString;
    }

    function minimizeCalculator() {
        // minimizes to dashboard or home index.html
        window.location.href = 'index.html';
    }

    // CALCULATOR LOGIC
    let currentInput = "0";
    let historyInput = "";

    function updateDisplay() {
        document.getElementById('calc-display').innerText = currentInput;
        document.getElementById('calc-history').innerText = historyInput;
    }

    function appendValue(val) {
        if (currentInput === "0" && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay();
    }

    function clearCalculator() {
        currentInput = "0";
        historyInput = "";
        updateDisplay();
    }

    function deleteLast() {
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }

    function calculateResult() {
        try {
            historyInput = currentInput;
            let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(sanitized);
            currentInput = Number.isFinite(result) ? String(result) : "Error";
            updateDisplay();
        } catch (error) {
            currentInput = "Error";
            updateDisplay();
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateDynamicHeader();
        
        const savedName = localStorage.getItem('profile_name');
        if(savedName) {
            document.getElementById('sidebar-profile-name').innerText = savedName;
        }
    });
</script>
</body>
</html>
