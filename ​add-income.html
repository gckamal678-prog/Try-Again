<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Income Sources</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- TOAST NOTIFICATION -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

<div class="flex flex-col min-h-screen w-full max-w-2xl mx-auto">
    <!-- HEADER -->
    <header class="sticky top-0 z-40 flex items-center justify-between px-4 py-3.5 bg-slate-900 border-b border-slate-800 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <span class="text-xs font-bold text-white tracking-wide">Digital NoteBook</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200">ENG</button>
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm">🌛</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 space-y-4 flex-1 w-full text-xs">
        <div>
            <p id="dynamic-date" class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-1"></p>
            <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-wallet text-emerald-500"></i> <span class="lang-text" data-en="Income Sources Manager" data-np="आम्दानी स्रोत व्यवस्थापक">Income Sources Manager</span>
            </h2>
        </div>

        <!-- INCOME FORM SECTION -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 space-y-3">
            <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-emerald-500"></i> <span class="lang-text" data-en="Add Income Source Form" data-np="आम्दानी स्रोत थप्ने फारम">Add Income Source Form</span>
            </h3>

            <form id="income-form" onsubmit="saveIncome(event)" class="space-y-3">
                <input type="hidden" id="edit-income-index" value="">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1"><span class="lang-text" data-en="Income Source Name" data-np="आम्दानी स्रोतको नाम">Income Source Name</span></label>
                        <input type="text" id="income-source-name" placeholder="e.g. Salary, Business" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1"><span class="lang-text" data-en="Date" data-np="मिति">Date</span></label>
                        <input type="date" id="income-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1"><span class="lang-text" data-en="Amount (NPR / INR)" data-np="रकम (नेरु / भारु)">Amount (NPR / INR)</span></label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="income-amount-npr" oninput="calculateIncomeTotal()" placeholder="NPR (Rs)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                            <input type="number" step="any" id="income-amount-inr" oninput="calculateIncomeTotal()" placeholder="INR (₹)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1"><span class="lang-text" data-en="Total Amount (NPR)" data-np="जम्मा रकम (नेरु)">Total Amount (NPR)</span></label>
                        <input type="text" id="income-total-calc" readonly placeholder="Total in NPR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs outline-none font-bold">
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="button" id="income-cancel-btn" onclick="resetIncomeForm()" class="hidden w-1/3 bg-slate-500 text-white p-2.5 rounded-xl text-xs font-semibold"><span class="lang-text" data-en="Cancel" data-np="रद्द गर्नुहोस्">Cancel</span></button>
                    <button type="submit" id="income-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2.5 rounded-xl text-xs transition shadow-md"><span class="lang-text" data-en="Save Income Record" data-np="आम्दानी रेकर्ड सेभ गर्नुहोस्">Save Income Record</span></button>
                </div>
            </form>
        </div>

        <!-- SAVED TRANSACTIONS / INCOME LIST SECTION -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-list text-indigo-500"></i> <span class="lang-text" data-en="Saved Income Records" data-np="सेभ गरिएका आम्दानी रेकर्डहरू">Saved Income Records</span>
                </h3>
                <button onclick="printIncomePDF()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-print"></i> Print</button>
            </div>

            <div id="income-list-container" class="space-y-2 pt-1 max-h-72 overflow-y-auto">
                <!-- Dynamic Records Will Show Here -->
            </div>

            <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-bold">
                <span><span class="lang-text" data-en="Total Income:" data-np="जम्मा आम्दानी:">Total Income:</span></span>
                <span id="income-table-total" class="text-emerald-500 text-sm">Rs 0.00</span>
            </div>
        </div>
    </main>
</div>

<script>
    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        renderIncomes();
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('theme-toggle-btn').innerText = '🌞';
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('theme-toggle-btn').innerText = '🌛';
        }
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = dateString;
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if(!container) return;
        const toast = document.createElement('div');
        toast.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white px-4 py-2 rounded-xl shadow-lg text-xs font-semibold`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    const INR_RATE = 1.6;

    function calculateIncomeTotal() {
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = npr + (inr * INR_RATE);
        document.getElementById('income-total-calc').value = total.toFixed(2);
    }

    function saveIncome(event) {
        event.preventDefault();
        const index = document.getElementById('edit-income-index').value;
        const sourceName = document.getElementById('income-source-name').value.trim();
        const date = document.getElementById('income-date').value;
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = parseFloat(document.getElementById('income-total-calc').value) || 0;

        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        const item = { sourceName, date, npr, inr, total };

        if (index === "") {
            incomes.unshift(item);
            showToast('आम्दानी सफलतापूर्वक सेभ भयो!', 'success');
        } else {
            incomes[index] = item;
            showToast('आम्दानी रेकर्ड अपडेट भयो!', 'success');
        }

        localStorage.setItem('digital_notebook_incomes', JSON.stringify(incomes));
        resetIncomeForm();
        renderIncomes();
    }

    function resetIncomeForm() {
        document.getElementById('income-form').reset();
        document.getElementById('edit-income-index').value = "";
        document.getElementById('income-submit-btn').innerText = currentLang === 'NEP' ? 'आम्दानी रेकर्ड सेभ गर्नुहोस्' : 'Save Income Record';
        document.getElementById('income-cancel-btn').classList.add('hidden');
        document.getElementById('income-date').valueAsDate = new Date();
        calculateIncomeTotal();
    }

    function renderIncomes() {
        const container = document.getElementById('income-list-container');
        const totalContainer = document.getElementById('income-table-total');
        if(!container) return;

        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        container.innerHTML = '';

        if (incomes.length === 0) {
            container.innerHTML = `<p class="text-slate-400 text-center py-3">कुनै आम्दानी रेकर्ड फेला परेन।</p>`;
            if(totalContainer) totalContainer.innerText = 'Rs 0.00';
            return;
        }

        let cumulativeTotal = 0;

        incomes.forEach((inc, idx) => {
            cumulativeTotal += inc.total;
            const div = document.createElement('div');
            div.className = "flex justify-between items-center bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 p-3 rounded-xl text-xs";
            div.innerHTML = `
                <div>
                    <h4 class="font-bold text-slate-900 dark:text-white text-xs">${inc.sourceName}</h4>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400">${inc.date} • NPR: ${inc.npr} | INR: ${inc.inr}</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-bold text-emerald-500">Rs ${inc.total.toFixed(2)}</span>
                    <button onclick="editIncome(${idx})" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="deleteIncome(${idx})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        });

        if(totalContainer) totalContainer.innerText = `Rs ${cumulativeTotal.toFixed(2)}`;
    }

    function editIncome(idx) {
        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        const inc = incomes[idx];
        if(!inc) return;

        document.getElementById('edit-income-index').value = idx;
        document.getElementById('income-source-name').value = inc.sourceName;
        document.getElementById('income-date').value = inc.date;
        document.getElementById('income-amount-npr').value = inc.npr;
        document.getElementById('income-amount-inr').value = inc.inr;
        document.getElementById('income-total-calc').value = inc.total;

        document.getElementById('income-submit-bin-btn') || (document.getElementById('income-submit-btn').innerText = currentLang === 'NEP' ? 'अपडेट गर्नुहोस्' : 'Update Income');
        document.getElementById('income-cancel-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteIncome(idx) {
        if(confirm('के तपाईं यो आम्दानी रेकर्ड हटाउन निश्चित हुनुहुन्छ?')) {
            let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
            incomes.splice(idx, 1);
            localStorage.setItem('digital_notebook_incomes', JSON.stringify(incomes));
            renderIncomes();
            showToast('आम्दानी रेकर्ड हटाइयो!', 'success');
        }
    }

    function printIncomePDF() {
        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        if(incomes.length === 0) {
            showToast('प्रिन्ट गर्न कुनै डाटा छैन!', 'error');
            return;
        }
        let printWindow = window('', '_blank');
        let html = `<html><head><title>Income Report</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin-top:15px;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f2f2f2;}</style></head><body><h2>Income Report</h2><table><tr><th>Date</th><th>Source</th><th>NPR</th><th>INR</th><th>Total</th></tr>`;
        let sum = 0;
        incomes.forEach(i => {
            sum += i.total;
            html += `<tr><td>${i.date}</td><td>${i.sourceName}</td><td>${i.npr}</td><td>${i.inr}</td><td>Rs ${i.total.toFixed(2)}</td></tr>`;
        });
        html += `</table><h3>Total: Rs ${sum.toFixed(2)}</h3></body></html>`;
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.print();
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateDynamicHeader();
        renderIncomes();
        const dateInput = document.getElementById('income-date');
        if(dateInput && !dateInput.value) {
            dateInput.valueAsDate = new Date();
        }
    });
</script>
</body>
</html>
