<!-- Firebase SDK Modules Import -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function backupToCloud(userId = "default_user") {
        try {
            const localData = {
                incomes: JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]'),
                theme: localStorage.getItem('theme') || 'dark',
                language: localStorage.getItem('lang') || 'EN',
                updatedAt: new Date().toISOString()
            };
            await set(ref(db, 'users/' + userId + '/income_module'), localData);
            showToast(currentLang === 'NEP' ? 'डाटा सफलतापूर्वक क्लाउडमा सेभ भयो!' : 'Data successfully saved to cloud!', 'success');
        } catch (error) {
            console.error("Cloud Backup Error:", error);
            showToast(error.message, 'error');
        }
    }

    async function restoreFromCloud(userId = "default_user") {
        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${userId}/income_module`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.incomes) localStorage.setItem('digital_notebook_incomes', JSON.stringify(data.incomes));
                if (data.theme) localStorage.setItem('theme', data.theme);
                if (data.language) localStorage.setItem('lang', data.language);
                
                showToast(currentLang === 'NEP' ? 'डाटा सफलतापूर्वक सिंक भयो!' : 'Data successfully synced from cloud!', 'success');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast(currentLang === 'NEP' ? 'क्लाउडमा कुनै ब्याकअप फेला परेन!' : 'No backup found in cloud!', 'error');
            }
        } catch (error) {
            console.error("Cloud Restore Error:", error);
            showToast(error.message, 'error');
        }
    }

    window.handleCloudBackup = () => backupToCloud("default_user");
    window.handleCloudRestore = () => restoreFromCloud("default_user");
</script>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
        renderIncomes();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;
    }

    setInterval(updateDynamicHeader, 1000);

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if(!container) return;
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
        toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold transform transition-all duration-300 translate-y-2 opacity-0 flex items-center gap-2`;
        toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
        setTimeout(() => {
            toast.classList.add('translate-y-2', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if(content) content.classList.toggle('hidden');
        if(icon) icon.classList.toggle('rotate-180');
    }

    // INCOME LOGIC
    const INR_RATE = 1.6;

    function calculateIncomeTotal() {
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = npr + (inr * INR_RATE);
        document.getElementById('income-total-calc').value = total.toFixed(2);
    }

    function saveIncome(event) {
        event.preventDefault();
        const index = document.getElementById('edit-income-index').value;
        const sourceName = document.getElementById('income-source-name').value.trim();
        const date = document.getElementById('income-date').value;
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = parseFloat(document.getElementById('income-total-calc').value) || 0;

        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        const item = { sourceName, date, npr, inr, total };

        if (index === "") {
            incomes.unshift(item);
            showToast(currentLang === 'NEP' ? 'आम्दानी सफलतापूर्वक थपियो!' : 'Income added successfully!', 'success');
        } else {
            incomes[index] = item;
            showToast(currentLang === 'NEP' ? 'आम्दानी अपडेट भयो!' : 'Income updated successfully!', 'success');
        }

        localStorage.setItem('digital_notebook_incomes', JSON.stringify(incomes));
        resetIncomeForm();
        renderIncomes();
    }

    function resetIncomeForm() {
        document.getElementById('income-form').reset();
        document.getElementById('edit-income-index').value = "";
        document.getElementById('income-submit-btn').innerText = currentLang === 'NEP' ? 'आम्दानी थप्नुहोस्' : 'Add Income';
        document.getElementById('income-cancel-btn').classList.add('hidden');
        document.getElementById('income-date').valueAsDate = new Date();
        calculateIncomeTotal();
    }

    function renderIncomes() {
        const container = document.getElementById('income-list-container');
        const totalContainer = document.getElementById('income-table-total');
        if(!container) return;

        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        container.innerHTML = '';

        if (incomes.length === 0) {
            container.innerHTML = `<p class="text-slate-400 text-center py-3">${currentLang === 'NEP' ? 'कुनै आम्दानी रेकर्ड फेला परेन।' : 'No income records found.'}</p>`;
            if(totalContainer) totalContainer.innerText = 'Rs 0.00';
            return;
        }

        let cumulativeTotal = 0;

        incomes.forEach((inc, idx) => {
            cumulativeTotal += inc.total;
            const div = document.createElement('div');
            div.className = "flex justify-between items-center bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 p-3 rounded-xl text-xs";
            div.innerHTML = `
                <div>
                    <h4 class="font-bold text-slate-900 dark:text-white text-xs">${inc.sourceName}</h4>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400">${inc.date} • NPR: ${inc.npr} | INR: ${inc.inr}</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-bold text-emerald-500">Rs ${inc.total.toFixed(2)}</span>
                    <button onclick="editIncome(${idx})" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="deleteIncome(${idx})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        });

        if(totalContainer) totalContainer.innerText = `Rs ${cumulativeTotal.toFixed(2)}`;
    }

    function editIncome(idx) {
        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        const inc = incomes[idx];
        if(!inc) return;

        document.getElementById('edit-income-index').value = idx;
        document.getElementById('income-source-name').value = inc.sourceName;
        document.getElementById('income-date').value = inc.date;
        document.getElementById('income-amount-npr').value = inc.npr;
        document.getElementById('income-amount-inr').value = inc.inr;
        document.getElementById('income-total-calc').value = inc.total;

        document.getElementById('income-submit-btn').innerText = currentLang === 'NEP' ? 'अपडेट गर्नुहोस्' : 'Update Income';
        document.getElementById('income-cancel-btn').classList.remove('hidden');

        const content = document.getElementById('content-section-income');
        if (content && content.classList.contains('hidden')) {
            toggleAccordion('section-income');
        }
    }

    function deleteIncome(idx) {
        if(confirm(currentLang === 'NEP' ? 'के तपाईं यो आम्दानी रेकर्ड हटाउन निश्चित हुनुहुन्छ?' : 'Are you sure you want to delete this income record?')) {
            let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
            incomes.splice(idx, 1);
            localStorage.setItem('digital_notebook_incomes', JSON.stringify(incomes));
            renderIncomes();
            showToast(currentLang === 'NEP' ? 'आम्दानी रेकर्ड हटाइयो!' : 'Income record deleted successfully!', 'success');
        }
    }

    function printIncomePDF() {
        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        if(incomes.length === 0) {
            showToast(currentLang === 'NEP' ? 'प्रिन्ट गर्न कुनै डाटा छैन!' : 'No data to print!', 'error');
            return;
        }
        
        let printWindow = window('', '_blank');
        let html = `
            <html>
            <head>
                <title>Income Report - Digital NoteBook</title>
                <style>
                    body { font-family: sans-serif; padding: 20px; color: #333; font-size: 12px; }
                    h2 { text-align: center; margin-bottom: 5px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                    th { background-color: #f2f2f2; }
                    .total { text-align: right; font-weight: bold; margin-top: 10px; font-size: 14px; }
                </style>
            </head>
            <body>
                <h2>Digital NoteBook - Income Sources Report</h2>
                <p style="text-align: center; color: #666;">Date: ${new Date().toLocaleDateString()}</p>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Source Name</th>
                            <th>NPR</th>
                            <th>INR</th>
                            <th>Total (NPR)</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        let sum = 0;
        incomes.forEach(i => {
            sum += i.total;
            html += `<tr><td>${i.date}</td><td>${i.sourceName}</td><td>${i.npr}</td><td>${i.inr}</td><td>Rs ${i.total.toFixed(2)}</td></tr>`;
        });

        html += `
                    </tbody>
                </table>
                <div class="total">Total Income: Rs ${sum.toFixed(2)}</div>
            </body>
            </html>
        `;
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        showToast(currentLang === 'NEP' ? 'विवरण सफलतापूर्वक सेभ भयो!' : 'Details saved successfully!', 'success');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || 'Kamal G.C.';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        renderIncomes();

        const dateInput = document.getElementById('income-date');
        if(dateInput && !dateInput.value) {
            dateInput.valueAsDate = new Date();
        }
    });
</script>
</body>
</html>
