<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    @keyframes pulseGlow {
        0%, 100% {
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.4));
        }
        50% {
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.8));
        }
    }
    .animated-title {
        animation: pulseGlow 3s infinite ease-in-out;
    }
    @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .animate-rainbow {
        background-size: 300% auto;
        animation: rainbow 5s linear infinite;
    }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- WELCOME SPLASH SCREEN (6 Seconds) -->
<div id="splash-screen" class="fixed inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-700">
    <div class="text-center space-y-6">
        <div class="flex justify-center">
            <div class="w-20 h-20 rounded-full bg-slate-900/80 border-2 border-indigo-500/40 p-2 shadow-2xl flex items-center justify-center backdrop-blur-md overflow-hidden">
                <img src="N1024.png" alt="Logo" class="w-full h-full object-cover rounded-full">
            </div>
        </div>
        <div class="space-y-1">
            <p class="text-indigo-400 text-[11px] font-semibold tracking-widest uppercase">Welcome</p>
            <h1 class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-200 via-sky-300 to-white animated-title">
                DIGITAL NOTEBOOK
            </h1>
        </div>
    </div>
</div>

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-300 to-red-500">
                        Digital <span class="text-red-500">NoteBook</span>
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">
                ✕
            </button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <nav class="space-y-1 font-medium">
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/20 transition"><span>📊</span> <span>Overview</span></a>
            </nav>

            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="" alt="Profile" class="w-full h-full object-cover hidden">
                        <span id="sidebar-avatar-icon" class="text-white text-sm">📷</span>
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm">Guest User</h3>
                    <p class="text-[10px] text-slate-400">Click icon to set photo</p>
                </div>
            </div>

            <!-- Personal Info Form -->
            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-indigo-400"></i> Personal Info
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5 flex items-center gap-1">
                        <i class="fa-solid fa-user text-indigo-400"></i> Full Name
                    </label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-rose-400"></i> Address
                    </label>
                    <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5 flex items-center gap-1">
                        <i class="fa-solid fa-phone text-emerald-400"></i> Mobile Number
                    </label>
                    <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition flex items-center justify-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-floppy-disk"></i> Save Info
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full">
        
        <!-- HEADER SECTION (With N1024.png logo & Flowing Rainbow Title) -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-4 py-3 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
            <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-indigo-400 transition">
                ☰
            </button>

            <!-- Brand Title with Flowing Rainbow Effect -->
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg overflow-hidden border border-indigo-500/50 shadow-sm flex-shrink-0">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-sm md:text-base font-extrabold tracking-wider bg-gradient-to-r from-red-500 via-yellow-400 via-green-400 via-cyan-400 via-purple-500 to-pink-500 animate-rainbow bg-clip-text text-transparent">
                    Digital NoteBook
                </h1>
            </div>

            <div class="relative">
                <div class="w-8 h-8 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-sm">
                    <img id="header-avatar-img" src="" alt="Profile" class="w-full h-full object-cover hidden">
                    <span id="header-avatar-icon" class="text-white text-xs">📷</span>
                </div>
            </div>
        </header>

        <main class="p-3 md:p-4 space-y-4 flex-1 w-full text-xs">
            
            <!-- DATE, GREETING & QR CODE SECTION -->
            <div class="flex justify-between items-start px-1 py-1 text-white">
                <div>
                    <p id="dynamic-date" class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase mb-0.5"></p>
                    <h2 id="dynamic-greeting" class="text-base font-bold text-slate-800 dark:text-white tracking-tight"></h2>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">Here is what is happening with your money today.</p>
                </div>
                
                <!-- QR Code Display Box -->
                <div class="bg-white p-1.5 rounded-lg shadow border border-slate-200 dark:border-slate-800 flex-shrink-0">
                    <div class="w-12 h-12 bg-slate-900 text-white flex items-center justify-center text-[10px] font-bold rounded">
                        QR
                    </div>
                </div>
            </div>

            <!-- GRID MENU (4 items per row, NO CARDS / flat layout with custom emoji colors) -->
            <div class="grid grid-cols-4 gap-3 pt-2">
                
                <!-- 1. Income -->
                <button onclick="handleMenuClick('Income')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        💰
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Income</span>
                </button>

                <!-- 2. Invest -->
                <button onclick="handleMenuClick('Invest')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        📈
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Invest</span>
                </button>

                <!-- 3. Receivable -->
                <button onclick="handleMenuClick('Receivable')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 dark:bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        📥
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Receivable</span>
                </button>

                <!-- 4. Giveble -->
                <button onclick="handleMenuClick('Giveble')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-rose-500/10 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        📤
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Giveble</span>
                </button>

                <!-- 5. Saving -->
                <button onclick="handleMenuClick('Saving')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 dark:bg-purple-500/20 text-purple-600 dark:text-purple-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        piggy_bank
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Saving</span>
                </button>

                <!-- 6. Calculate -->
                <button onclick="handleMenuClick('Calculate')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-amber-500/10 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        🧮
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Calculate</span>
                </button>

                <!-- 7. Notebook -->
                <button onclick="handleMenuClick('Notebook')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        📋
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Notebook</span>
                </button>

                <!-- 8. Setting -->
                <button onclick="handleMenuClick('Setting')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-slate-500/10 dark:bg-slate-500/20 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        ⚙️
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Setting</span>
                </button>

                <!-- 9. Account -->
                <button onclick="handleMenuClick('Account')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-teal-500/10 dark:bg-teal-500/20 text-teal-600 dark:text-teal-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        👤
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Account</span>
                </button>

                <!-- 10. Calendar -->
                <button onclick="handleMenuClick('Calendar')" class="flex flex-col items-center justify-center p-2 text-center group focus:outline-none">
                    <div class="w-12 h-12 rounded-2xl bg-pink-500/10 dark:bg-pink-500/20 text-pink-600 dark:text-pink-400 flex items-center justify-center text-xl mb-1.5 shadow-sm group-hover:scale-105 transition-transform">
                        📅
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200">Calendar</span>
                </button>

            </div>

        </main>
    </div>
</div>

<script>
    // Toggle Sidebar
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            sidebar.classList.toggle('-translate-x-full');
        }
    }

    // Live Date, Time & Dynamic Greeting
    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString('en-US', options).toUpperCase();
        
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;

        const hours = now.getHours();
        let greetingText = 'Good morning';
        if (hours >= 12 && hours < 17) {
            greetingText = 'Good afternoon';
        } else if (hours >= 17) {
            greetingText = 'Good evening';
        }

        const savedName = localStorage.getItem('profile_name') || '';
        const greetingEl = document.getElementById('dynamic-greeting');
        if (greetingEl) {
            greetingEl.innerText = savedName ? `${greetingText}, ${savedName}` : greetingText;
        }
    }

    setInterval(updateDynamicHeader, 1000);

    // Profile Details Save Function
    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        updateDynamicHeader();
        alert('Details saved successfully!');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName ? savedName : 'Guest User';
    }

    // Avatar Upload Handler
    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar');
        if (savedImage) {
            ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
                const img = document.getElementById(id);
                if(img) {
                    img.src = savedImage;
                    img.classList.remove('hidden');
                }
            });
            ['sidebar-avatar-icon', 'header-avatar-icon'].forEach(id => {
                const icon = document.getElementById(id);
                if(icon) icon.classList.add('hidden');
            });
        }
    }

    function handleMenuClick(menuName) {
        alert(menuName + " clicked!");
    }

    // Initial load
    document.addEventListener("DOMContentLoaded", () => {
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        
        // Remove Splash Screen after 6000ms (6 seconds)
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) splash.remove();
        }, 6000);
    });
</script>
</body>
</html>
