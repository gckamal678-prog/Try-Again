<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .animate-rainbow {
        background-size: 300% auto;
        animation: rainbow 5s linear infinite;
    }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- TOAST NOTIFICATION -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-md">
                    <i class="fa-solid fa-book-open text-white"></i>
                </div>
                <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-300 to-red-500">
                    Digital <span class="text-red-500">NoteBook</span>
                </h1>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="" alt="Profile" class="w-full h-full object-cover hidden" onerror="this.classList.add('hidden')">
                        <i id="sidebar-avatar-icon" class="fa-solid fa-user text-white"></i>
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm">Kamal G.C.</h3>
                    <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Click icon to set photo" data-np="फोटो राख्न क्लिक गर्नुहोस्">Click icon to set photo</span></p>
                </div>
            </div>

            <nav class="space-y-1 font-medium">
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-md transition"><span>🧮</span> <span class="lang-text" data-en="Digital Calculator" data-np="डिजिटल क्याल्कुलेटर">Digital Calculator</span></a>
            </nav>

            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-indigo-400"></i> <span class="lang-text" data-en="Personal Info" data-np="व्यक्तिगत विवरण">Personal Info</span>
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5">Full Name</label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs outline-none">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition shadow-md mt-2">
                    Save Info
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full">
        <!-- HEADER -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
            <div class="flex items-center space-x-2">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none">☰</button>
                <span class="text-xs font-bold text-white tracking-wide">Digital NoteBook</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm">🌛</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="p-4 md:p-6 space-y-4 flex-1 w-full text-xs flex flex-col items-center justify-center">
            <div class="w-full max-w-sm">
                <div class="flex justify-between items-center px-1 mb-3">
                    <div>
                        <p id="dynamic-date" class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-1"></p>
                        <h2 class="text-base md:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-calculator text-indigo-500"></i> <span class="lang-text" data-en="Digital Calculator" data-np="डिजिटल क्याल्कुलेटर">Digital Calculator</span>
                        </h2>
                    </div>
                </div>

                <!-- CALCULATOR CONTAINER -->
                <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                    <!-- Screen Display -->
                    <div class="bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-right flex flex-col justify-end h-24 overflow-hidden shadow-inner">
                        <div id="calc-history" class="text-slate-400 text-xs tracking-wide h-5 overflow-x-auto whitespace-nowrap"></div>
                        <div id="calc-display" class="text-slate-900 dark:text-white text-3xl font-bold tracking-wider overflow-x-auto whitespace-nowrap">0</div>
                    </div>

                    <!-- Keypad Grid -->
                    <div class="grid grid-cols-4 gap-2.5">
                        <button onclick="clearCalculator()" class="bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">C</button>
                        <button onclick="appendValue('%')" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">%</button>
                        <button onclick="deleteLast()" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm"><i class="fa-solid fa-delete-left"></i></button>
                        <button onclick="appendValue('/')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">÷</button>

                        <button onclick="appendValue('7')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">7</button>
                        <button onclick="appendValue('8')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">8</button>
                        <button onclick="appendValue('9')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">9</button>
                        <button onclick="appendValue('*')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">×</button>

                        <button onclick="appendValue('4')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">4</button>
                        <button onclick="appendValue('5')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">5</button>
                        <button onclick="appendValue('6')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">6</button>
                        <button onclick="appendValue('-')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">-</button>

                        <button onclick="appendValue('1')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">1</button>
                        <button onclick="appendValue('2')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">2</button>
                        <button onclick="appendValue('3')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">3</button>
                        <button onclick="appendValue('+')" class="bg-indigo-500/10 text-indigo-500 hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">+</button>

                        <button onclick="appendValue('0')" class="col-span-2 bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">0</button>
                        <button onclick="appendValue('.')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-indigo-600 hover:text-white font-bold p-3.5 rounded-2xl transition text-sm">.</button>
                        <button onclick="calculateResult()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3.5 rounded-2xl transition shadow-md text-sm">=</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('theme-toggle-btn').innerText = '🌞';
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('theme-toggle-btn').innerText = '🌛';
        }
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = dateString;
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if(!container) return;
        const toast = document.createElement('div');
        toast.className = `${type === 'success' ? 'bg-indigo-600' : 'bg-rose-600'} text-white px-4 py-2 rounded-xl shadow-lg text-xs font-semibold`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // CALCULATOR LOGIC
    let currentInput = "0";
    let historyInput = "";

    function updateDisplay() {
        document.getElementById('calc-display').innerText = currentInput;
        document.getElementById('calc-history').innerText = historyInput;
    }

    function appendValue(val) {
        if (currentInput === "0" && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay();
    }

    function clearCalculator() {
        currentInput = "0";
        historyInput = "";
        updateDisplay();
    }

    function deleteLast() {
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }

    function calculateResult() {
        try {
            historyInput = currentInput;
            // प्रतिशत (percentage) हिसाब गर्नका लागि मिलाइएको
            let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(sanitized);
            currentInput = Number.isFinite(result) ? String(result) : "Error";
            updateDisplay();
        } catch (error) {
            currentInput = "Error";
            updateDisplay();
        }
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        if(name) localStorage.setItem('profile_name', name);
        document.getElementById('sidebar-profile-name').innerText = name || 'Kamal G.C.';
        showToast('विवरण सेभ भयो!', 'success');
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateDynamicHeader();
        
        const savedName = localStorage.getItem('profile_name');
        if(savedName) {
            document.getElementById('sidebar-profile-name').innerText = savedName;
            document.getElementById('input-full-name').value = savedName;
        }
    });
</script>
</body>
</html>
