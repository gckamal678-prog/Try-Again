<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculate - Digital NoteBook</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen p-4">
    <header class="flex items-center justify-between pb-4 border-b border-slate-800">
        <a href="index.html" class="text-indigo-400 font-bold"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1 class="font-bold text-sm">Calculator</h1>
        <div></div>
    </header>
    <div class="flex-1 flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl w-full max-w-xs shadow-xl">
            <input type="text" id="calc-display" readonly class="w-full bg-slate-950 border border-slate-800 text-right text-xl p-3 rounded-xl mb-4 text-white font-mono" value="0">
            <div class="grid grid-cols-4 gap-2 text-sm font-bold">
                <button onclick="clearCalc()" class="bg-rose-600/20 text-rose-400 p-3 rounded-xl">C</button>
                <button onclick="appendValue('/')" class="bg-slate-800 p-3 rounded-xl">÷</button>
                <button onclick="appendValue('*')" class="bg-slate-800 p-3 rounded-xl">×</button>
                <button onclick="appendValue('-')" class="bg-slate-800 p-3 rounded-xl">-</button>
                <button onclick="appendValue('7')" class="bg-slate-800 p-3 rounded-xl">7</button>
                <button onclick="appendValue('8')" class="bg-slate-800 p-3 rounded-xl">8</button>
                <button onclick="appendValue('9')" class="bg-slate-800 p-3 rounded-xl">9</button>
                <button onclick="appendValue('+')" class="bg-slate-800 p-3 rounded-xl">+</button>
                <button onclick="appendValue('4')" class="bg-slate-800 p-3 rounded-xl">4</button>
                <button onclick="appendValue('5')" class="bg-slate-800 p-3 rounded-xl">5</button>
                <button onclick="appendValue('6')" class="bg-slate-800 p-3 rounded-xl">6</button>
                <button onclick="calculateResult()" class="bg-indigo-600 text-white p-3 rounded-xl row-span-2 flex items-center justify-center">=</button>
                <button onclick="appendValue('1')" class="bg-slate-800 p-3 rounded-xl">1</button>
                <button onclick="appendValue('2')" class="bg-slate-800 p-3 rounded-xl">2</button>
                <button onclick="appendValue('3')" class="bg-slate-800 p-3 rounded-xl">3</button>
                <button onclick="appendValue('0')" class="bg-slate-800 p-3 rounded-xl col-span-2">0</button>
                <button onclick="appendValue('.')" class="bg-slate-800 p-3 rounded-xl">.</button>
            </div>
        </div>
    </div>
<script>
    const display = document.getElementById('calc-display');
    function appendValue(val) { if(display.value === '0' && val !== '.') display.value = val; else display.value += val; }
    function clearCalc() { display.value = '0'; }
    function calculateResult() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }
</script>
</body>
</html>
