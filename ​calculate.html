<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Digital Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Anek+Devanagari:wght@400;500;700&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .animate-rainbow {
        background-size: 300% auto;
        animation: rainbow 5s linear infinite;
    }
</style>
</head>
<body id="main-body" class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- TOAST NOTIFICATION CONTAINER -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-300 to-red-500">
                        Digital <span class="text-red-500">NoteBook</span>
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span class="lang-text" data-en="Overview" data-np="अवलोकन">Overview</span></a>
                <a href="notebook.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📝</span> <span class="lang-text" data-en="NotePad Studio" data-np="नोटप्याड स्टुडियो">NotePad Studio</span></a>
                <a href="calculate.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/20 transition"><span>🧮</span> <span class="lang-text" data-en="Digital Calculator" data-np="डिजिटल क्याल्कुलेटर">Digital Calculator</span></a>
                <a href="setting.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>⚙️</span> <span class="lang-text" data-en="Settings & About" data-np="सेटिङ र बारेमा">Settings & About</span></a>
            </nav>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full">
        
        <!-- HEADER SECTION -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
            <div class="flex items-center space-x-2">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-indigo-400 transition">☰</button>
                <div class="flex items-center space-x-1.5 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-indigo-600 border border-indigo-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs font-bold text-white tracking-wide hidden sm:inline">Digital NoteBook</span>
                </div>
            </div>

            <div class="text-center px-1 hidden md:block">
                <h1 class="text-base font-extrabold tracking-wider bg-gradient-to-r from-red-500 via-yellow-400 via-green-400 via-cyan-400 via-purple-500 to-pink-500 animate-rainbow bg-clip-text text-transparent">
                    Digital NoteBook
                </h1>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
            </div>
        </header>

        <main class="p-4 md:p-6 space-y-4 flex-1 w-full text-xs flex flex-col items-center justify-center">
            
            <!-- Calculator Card Wrapper -->
            <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4">
                
                <!-- Calculator Header / Mode -->
                <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                    <span class="font-bold text-slate-700 dark:text-slate-300" data-i18n="calc_title">Digital Calculator</span>
                    <button onclick="clearHistory()" class="text-[10px] text-indigo-600 dark:text-indigo-400 font-semibold hover:underline" data-i18n="clear_history">Clear History</button>
                </div>

                <!-- Display Screen -->
                <div class="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 text-right space-y-1">
                    <div id="calc-history" class="text-[11px] text-slate-400 min-h-[16px] overflow-x-auto"></div>
                    <div id="calc-display" class="text-2xl font-bold text-slate-900 dark:text-white tracking-wider overflow-x-auto">0</div>
                </div>

                <!-- Keypad Grid -->
                <div class="grid grid-cols-4 gap-2">
                    <!-- Row 1 -->
                    <button onclick="clearAll()" class="p-3 rounded-xl bg-rose-100 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 font-bold hover:bg-rose-200 transition">C</button>
                    <button onclick="deleteDigit()" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition"><i class="fa-solid fa-delete-left"></i></button>
                    <button onclick="appendOperator('%')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition">%</button>
                    <button onclick="appendOperator('/')" class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-indigo-100 transition">÷</button>
                    
                    <!-- Row 2 -->
                    <button onclick="appendNumber('7')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">7</button>
                    <button onclick="appendNumber('8')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">8</button>
                    <button onclick="appendNumber('9')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">9</button>
                    <button onclick="appendOperator('*')" class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-indigo-100 transition">×</button>
                    
                    <!-- Row 3 -->
                    <button onclick="appendNumber('4')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">4</button>
                    <button onclick="appendNumber('5')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">5</button>
                    <button onclick="appendNumber('6')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">6</button>
                    <button onclick="appendOperator('-')" class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-indigo-100 transition">-</button>
                    
                    <!-- Row 4 -->
                    <button onclick="appendNumber('1')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">1</button>
                    <button onclick="appendNumber('2')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">2</button>
                    <button onclick="appendNumber('3')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">3</button>
                    <button onclick="appendOperator('+')" class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-indigo-100 transition">+</button>
                    
                    <!-- Row 5 -->
                    <button onclick="appendNumber('0')" class="col-span-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">0</button>
                    <button onclick="appendDecimal('.')" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">.</button>
                    <button onclick="calculateResult()" class="p-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md shadow-indigo-600/20 transition">=</button>
                </div>

            </div>

        </main>
    </div>
</div>

<script>
const translations = {
    en: {
        calc_title: "Digital Calculator",
        clear_history: "Clear History"
    },
    np: {
        calc_title: "डिजिटल क्याल्कुलेटर",
        clear_history: "इतिहास मेटाउनुहोस्"
    }
};

let currentLang = localStorage.getItem('lang') || 'en';
let currentInput = '0';
let expressionHistory = '';

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.toggle('-translate-x-full');
}

function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'np' : 'en';
    localStorage.setItem('lang', currentLang);
    updateLanguageUI();
}

function updateLanguageUI() {
    const langBtn = document.getElementById('lang-toggle-btn');
    if(langBtn) langBtn.innerText = currentLang === 'en' ? 'ENG' : 'नेपाली';

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang] && translations[currentLang][key]) {
            el.innerText = translations[currentLang][key];
        }
    });
}

function toggleTheme() {
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle-btn');
    if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        if(themeBtn) themeBtn.innerText = '🌞';
    } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        if(themeBtn) themeBtn.innerText = '🌛';
    }
}

function updateDisplay() {
    document.getElementById('calc-display').innerText = currentInput;
    document.getElementById('calc-history').innerText = expressionHistory;
}

function appendNumber(num) {
    if (currentInput === '0' || currentInput === 'Error') {
        currentInput = num;
    } else {
        currentInput += num;
    }
    updateDisplay();
}

function appendDecimal(dot) {
    const lastNum = currentInput.split(/[\+\-\*\/\%]/).pop();
    if (!lastNum.includes('.')) {
        currentInput += dot;
        updateDisplay();
    }
}

function appendOperator(op) {
    const lastChar = currentInput.slice(-1);
    if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
    } else {
        currentInput += op;
    }
    updateDisplay();
}

function clearAll() {
    currentInput = '0';
    expressionHistory = '';
    updateDisplay();
}

function deleteDigit() {
    if (currentInput.length > 1 && currentInput !== 'Error') {
        currentInput = currentInput.slice(0, -1);
    } else {
        currentInput = '0';
    }
    updateDisplay();
}

function calculateResult() {
    try {
        expressionHistory = currentInput;
        // Safe evaluation simulation for standard arithmetic
        let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
        let result = eval(sanitized);
        if (!isFinite(result)) {
            currentInput = 'Error';
        } else {
            currentInput = String(parseFloat(result.toFixed(6)));
        }
    } catch (error) {
        currentInput = 'Error';
    }
    updateDisplay();
}

function clearHistory() {
    expressionHistory = '';
    updateDisplay();
}

document.addEventListener("DOMContentLoaded", () => {
    updateLanguageUI();
    const isDark = document.documentElement.classList.contains('dark');
    const themeBtn = document.getElementById('theme-toggle-btn');
    if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    updateDisplay();
});
</script>
</body>
</html>
